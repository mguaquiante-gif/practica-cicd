# Nombre del workflow: aparece en la pestaña Actions de GitHub
name: CI - Pull Request

# EVENTO: qué acción en el repositorio activa este workflow
# (En el Paso 3 de la práctica agregarás también el evento push)
on:
  pull_request:
    branches: [ "master" ]

# JOBS: trabajos que se ejecutan cuando ocurre el evento
jobs:
  build:                        # identificador interno del job
    name: Build y pruebas       # nombre visible del job
    runs-on: ubuntu-latest      # RUNNER: máquina virtual que ejecuta el job

    # STEPS: pasos en orden; si uno falla, el job se detiene
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4          # action del Marketplace

      - name: Configurar Python
        uses: actions/setup-python@v5      # action del Marketplace
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Ejecutar pruebas
        run: pytest -v
