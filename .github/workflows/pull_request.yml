# Nombre del workflow: aparece en la pestaña Actions de GitHub
name: CI - Pull Request

# EVENTO: qué acción en el repositorio activa este workflow
# (En el Paso 3 de la práctica agregarás también el evento push)
on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]  

# JOBS: trabajos que se ejecutan cuando ocurre el evento
jobs:
  build:                        # identificador interno del job
    name: Build y pruebas (${{ matrix.os }})   # nombre visible del job
    # RUNNER: máquina virtual que ejecuta el job (una por cada SO de la matriz)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # si falla un SO, los demás siguen ejecutándose
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    # STEPS: pasos en orden; si uno falla, el job se detiene
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4          # action del Marketplace

      - name: Configurar Python
        uses: actions/setup-python@v5      # action del Marketplace
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Ejecutar pruebas
        run: pytest -v
